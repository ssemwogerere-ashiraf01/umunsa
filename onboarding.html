<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Complete Your Profile: Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px;">
    <h2>Complete your profile</h2>
    <p class="subtitle">You signed in with your university email. Fill in these details before using member features. Required fields are marked.</p>

    <div id="alert-box"></div>
    <p id="signed-in-as" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;"></p>

    <form id="onboarding-form">
      <div class="form-group">
        <label>Profile photo (optional)</label>
        <div style="display:flex;align-items:center;gap:1rem;">
          <img id="avatar-preview" src="" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);display:none;" />
          <div id="avatar-fallback" style="width:64px;height:64px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;"></div>
          <input type="file" id="avatar-file" accept="image/*" />
        </div>
      </div>

      <div class="form-group">
        <label for="full_name">Full name *</label>
        <input type="text" id="full_name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="phone">Phone number *</label>
        <input type="tel" inputmode="tel" autocomplete="tel" placeholder="+256 700 000000 / +1 …" id="phone" data-phone-intl required placeholder="e.g. 07XXXXXXXX or +2567XXXXXXXX" autocomplete="tel" />
      </div>
      <div class="form-group">
        <label for="registration_number">Registration number</label>
        <input type="text" id="registration_number" placeholder="e.g. 2026-B101-10000" />
      </div>
      <div class="form-group">
        <label for="campus">Campus *</label>
        <select id="campus" required data-placeholder="Select campus">
          <option value="">Select campus</option>
        </select>
      </div>
      <div class="form-group">
        <label for="faculty">Faculty / School *</label>
        <select id="faculty" required data-placeholder="Select faculty">
          <option value="">Select faculty</option>
        </select>
      </div>
      <div class="form-group">
        <label for="programme">Programme / Course *</label>
        <select id="programme" required data-placeholder="Select programme">
          <option value="">Select faculty first</option>
        </select>
      </div>
      <div class="form-group">
        <label for="academic_year">Academic year *</label>
        <select id="academic_year" required data-placeholder="Academic year">
          <option value="">Academic year</option>
        </select>
      </div>
      <div class="form-group">
        <label for="year_of_study">Year of study *</label>
        <select id="year_of_study" required data-placeholder="Year of study">
          <option value="">Year of study</option>
        </select>
      </div>
      <div class="form-group">
        <label for="semester">Semester *</label>
        <select id="semester" required data-placeholder="Semester">
          <option value="">Semester</option>
        </select>
      </div>
      <div class="form-group">
        <label for="hostel">Hall / Hostel *</label>
        <select id="hostel" required>
          <option value="">Select hostel</option>
            <option value="Katonga hostel">Katonga hostel</option>
            <option value="Bbosa hostel">Bbosa hostel</option>
            <option value="Kavuma hostel">Kavuma hostel</option>
            <option value="Lwanga hostel">Lwanga hostel</option>
            <option value="Byaben hostel">Byaben hostel</option>
            <option value="Kololo hostel">Kololo hostel</option>
            <option value="Ivis hostel">Ivis hostel</option>
            <option value="Canan hostel">Canan hostel</option>
            <option value="Fountain hostel">Fountain hostel</option>
            <option value="Angels hostel">Angels hostel</option>
            <option value="Wamala hostel">Wamala hostel</option>
            <option value="Mugagga hostel">Mugagga hostel</option>
            <option value="Micheal hall">Micheal hall</option>
            <option value="Onyango hall">Onyango hall</option>
            <option value="Campbell hall">Campbell hall</option>
            <option value="Mukasa hall">Mukasa hall</option>
            <option value="Martyrs hall">Martyrs hall</option>
            <option value="Haflet hall">Haflet hall</option>
            <option value="Carabine hall">Carabine hall</option>
          <option value="Other">Other (specify)</option>
        </select>
      </div>
      <div class="form-group" id="hostel-other-wrap" style="display:none;">
        <label for="hostel_other">Enter your hostel name *</label>
        <input type="text" id="hostel_other" placeholder="Enter your hostel name" />
      </div>
      <div class="form-group">
        <label for="bio">Short bio (optional)</label>
        <textarea id="bio" rows="3" placeholder="A line about yourself"></textarea>
      </div>

      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Save and continue</button>
    </form>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">

  function titleCase(str) {
    if (str == null) return str;
    const s = String(str).trim().replace(/\s+/g, ' ');
    if (!s) return s;
    return s.replace(/(^|[\s'’\-])(\S+)/g, (_, sep, word) =>
      sep + word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
    );
  }

  import { supabase } from './assets/js/supabase-client.js';
  import { routeAfterLogin } from './assets/js/auth.js';
  import { mountAcademicFields, readAcademicFields } from './assets/js/academic.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { BASE_URL, isUmuEmail } from './assets/js/site-config.js';

  mountNav();
  mountFooter();

  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.user) {
    window.location.href = `${BASE_URL}/apply.html`;
    throw new Error('redirect');
  }
  if (!isUmuEmail(session.user.email)) {
    await supabase.auth.signOut();
    window.location.href = `${BASE_URL}/apply.html`;
    throw new Error('redirect');
  }

  const { data: profile } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .maybeSingle();

  document.getElementById('signed-in-as').textContent = `Signed in as ${session.user.email}`;

  // Prefill
  const metaName = session.user.user_metadata?.full_name || session.user.user_metadata?.name || '';
  document.getElementById('full_name').value = profile?.full_name || metaName || '';
  document.getElementById('phone').value = profile?.phone || '';
  document.getElementById('registration_number').value = profile?.registration_number || '';
  await mountAcademicFields(document, {
    campus: profile?.campus || '',
    faculty: profile?.faculty || '',
    programme: profile?.programme || '',
    academic_year: profile?.academic_year || '',
    semester: profile?.semester,
    year_of_study: profile?.year_of_study,
  });
  document.getElementById('bio').value = profile?.bio || '';

  const hostelSel = document.getElementById('hostel');
  const known = profile?.hostel || '';
  if (known) {
    const match = [...hostelSel.options].some(o => o.value === known);
    if (match) hostelSel.value = known;
    else {
      hostelSel.value = 'Other';
      document.getElementById('hostel-other-wrap').style.display = 'block';
      document.getElementById('hostel_other').value = known;
      document.getElementById('hostel_other').required = true;
    }
  }

  let uploadedPhotoUrl = profile?.avatar_url || null;
  renderAvatar(uploadedPhotoUrl, profile?.full_name || metaName);

  document.getElementById('hostel').addEventListener('change', () => {
    const wrap = document.getElementById('hostel-other-wrap');
    const other = document.getElementById('hostel_other');
    if (hostelSel.value === 'Other') {
      wrap.style.display = 'block';
      other.required = true;
    } else {
      wrap.style.display = 'none';
      other.required = false;
      other.value = '';
    }
  });

  document.getElementById('avatar-file').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">Photo must be under 10MB.</div>`;
      e.target.value = '';
      return;
    }
    const ext = file.name.split('.').pop();
    const path = `${session.user.id}/avatar.${ext}`;
    const { error: uploadErr } = await supabase.storage.from('avatars').upload(path, file, { upsert: true, cacheControl: '3600' });
    if (uploadErr) {
      document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">Photo upload failed: ${uploadErr.message}</div>`;
      return;
    }
    const { data: pub } = supabase.storage.from('avatars').getPublicUrl(path);
    uploadedPhotoUrl = `${pub.publicUrl}?t=${Date.now()}`;
    renderAvatar(uploadedPhotoUrl, document.getElementById('full_name').value);
  });

  function renderAvatar(url, name) {
    const img = document.getElementById('avatar-preview');
    const fallback = document.getElementById('avatar-fallback');
    if (url) {
      img.src = url; img.style.display = 'block'; fallback.style.display = 'none';
    } else {
      img.style.display = 'none'; fallback.style.display = 'flex';
      fallback.textContent = (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase()).join('');
    }
  }

  document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    btn.disabled = true; btn.textContent = 'Saving...';

    const full_name = titleCase(document.getElementById('full_name').value);
    const phone = document.getElementById('phone').value.trim();
    const academic = readAcademicFields(document);
    let hostel = document.getElementById('hostel').value.trim();
    if (hostel === 'Other') {
      hostel = titleCase(document.getElementById('hostel_other').value);
    } else {
      hostel = titleCase(hostel);
    }
    if (!full_name || !phone || !academic.campus || !academic.faculty || !academic.programme || !hostel) {
      alertBox.innerHTML = `<div class="alert alert-error">Please fill all required fields (name, phone, campus, faculty, programme, hostel).</div>`;
      btn.disabled = false; btn.textContent = 'Save and continue';
      return;
    }

    const { error } = await supabase.from('profiles').update({
      full_name,
      phone,
      campus: academic.campus,
      faculty: academic.faculty,
      programme: academic.programme,
      academic_year: academic.academic_year,
      semester: academic.semester,
      year_of_study: academic.year_of_study,
      hostel,
      registration_number: document.getElementById('registration_number').value.trim() || null,
      bio: document.getElementById('bio').value.trim() || null,
      avatar_url: uploadedPhotoUrl,
      onboarding_completed: true,
      updated_at: new Date().toISOString(),
    }).eq('id', session.user.id);

    if (error) {
      alertBox.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
      btn.disabled = false; btn.textContent = 'Save and continue';
      return;
    }

    await routeAfterLogin();
  });
</script>
</body>
</html>
