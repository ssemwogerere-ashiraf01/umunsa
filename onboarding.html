<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Complete Your Profile: Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:480px;">
    <h2>Welcome! Let's finish setting up your account</h2>
    <p class="subtitle">Just a few details so admins and fellow members know a bit about you. This only takes a minute.</p>

    <div id="alert-box"></div>

    <form id="onboarding-form">
      <div class="form-group">
        <label>Profile photo</label>
        <div style="display:flex;align-items:center;gap:1rem;">
          <img id="avatar-preview" src="" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--border);display:none;" />
          <span id="avatar-fallback" style="width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink-navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;"></span>
          <input type="file" id="avatar_file" accept="image/png,image/jpeg,image/webp" style="flex:1;" />
        </div>
        <small style="color:var(--text-muted);">Optional: JPG, PNG or WEBP, up to 10MB. You can also add this later from My Profile.</small>
      </div>

      <div class="form-group">
        <label for="programme">Programme / Course</label>
        <input type="text" id="programme" required placeholder="e.g. Bachelor of Information Technology" />
      </div>
      <div class="form-group">
        <label for="year_of_study">Year of study</label>
        <input type="number" id="year_of_study" min="1" max="6" placeholder="e.g. 2" />
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="text" id="phone" required placeholder="e.g. 07XXXXXXXX" />
      </div>
      <div class="form-group">
        <label for="registration_number">Registration number</label>
        <input type="text" id="registration_number" placeholder="e.g. 2026-B101-10000" />
      </div>
      <div class="form-group">
        <label for="bio">A short line about you (optional)</label>
        <input type="text" id="bio" placeholder="e.g. Second-year IT student, loves debate and football" />
      </div>

      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Continue</button>
    </form>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { routeAfterLogin } from './assets/js/auth.js';

  mountNav();
  mountFooter();

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; throw new Error('no session'); }

  const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
    if (profile?.onboarding_completed) {
    // Already done this before: send them wherever they actually belong now.
    await routeAfterLogin();
    throw new Error('already onboarded');
  }

  document.getElementById('phone').value = profile?.phone || '';
  document.getElementById('registration_number').value = profile?.registration_number || '';
  document.getElementById('programme').value = profile?.programme || '';
  document.getElementById('year_of_study').value = profile?.year_of_study || '';
  document.getElementById('bio').value = profile?.bio || '';
  renderAvatar(profile?.avatar_url, profile?.full_name);

  let uploadedPhotoUrl = profile?.avatar_url || null;

  document.getElementById('avatar_file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const alertBox = document.getElementById('alert-box');

    if (file.size > 10 * 1024 * 1024) {
      alertBox.innerHTML = `<div class="alert alert-error">That image is larger than 10MB: please choose a smaller file.</div>`;
      e.target.value = '';
      return;
    }

    const ext = file.name.split('.').pop();
    const path = `${session.user.id}/avatar.${ext}`;
    const { error: uploadErr } = await supabase.storage.from('avatars').upload(path, file, { upsert: true, cacheControl: '3600' });
    if (uploadErr) {
      alertBox.innerHTML = `<div class="alert alert-error">Photo upload failed: ${uploadErr.message}</div>`;
      return;
    }
    const { data: pub } = supabase.storage.from('avatars').getPublicUrl(path);
    uploadedPhotoUrl = `${pub.publicUrl}?t=${Date.now()}`;
    renderAvatar(uploadedPhotoUrl, profile?.full_name);
  });

  function renderAvatar(url, name) {
    const img = document.getElementById('avatar-preview');
    const fallback = document.getElementById('avatar-fallback');
    if (url) {
      img.src = url; img.style.display = 'block'; fallback.style.display = 'none';
    } else {
      img.style.display = 'none'; fallback.style.display = 'flex';
      fallback.textContent = (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase()).join('');
    }
  }

  document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    btn.disabled = true; btn.textContent = 'Saving...';

    const programme = document.getElementById('programme').value.trim();
    if (!programme) {
      alertBox.innerHTML = `<div class="alert alert-error">Please enter your programme/course.</div>`;
      btn.disabled = false; btn.textContent = 'Continue';
      return;
    }

    const { error } = await supabase.from('profiles').update({
      programme,
      year_of_study: document.getElementById('year_of_study').value ? Number(document.getElementById('year_of_study').value) : null,
      phone: document.getElementById('phone').value.trim(),
      registration_number: document.getElementById('registration_number').value.trim() || null,
      bio: document.getElementById('bio').value.trim() || null,
      avatar_url: uploadedPhotoUrl,
      onboarding_completed: true,
    }).eq('id', session.user.id);

    if (error) {
      alertBox.innerHTML = `<div class="alert alert-error">${String(error.message || error)}</div>`;
      btn.disabled = false; btn.textContent = 'Continue';
      return;
    }

    await routeAfterLogin();
  });
</script>
</body>
</html>
