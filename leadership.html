<style>
  .leader-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:1.5rem; }

  .leader-card {
    background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
    padding:1.75rem; box-shadow:var(--shadow); text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .leader-card .avatar-wrap {
    width:72px; height:72px; border-radius:50%; overflow:hidden;
    background:var(--parchment); border:3px solid var(--border);
    margin-bottom:0.75rem; flex-shrink:0;
  }
  .leader-card .avatar-wrap img { width:100%; height:100%; object-fit:cover; }
  .leader-card .avatar-wrap .avatar-fallback {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--gold); color:var(--ink-navy);
    font-family:'Fraunces',serif; font-weight:700; font-size:1.2rem;
  }
  .leader-card h3 { margin:0; font-size:1.1rem; }
  .leader-card .position-label { font-size:0.85rem; color:var(--forest); font-weight:600; margin:0.2rem 0 0.5rem; }
  .leader-card .bio { font-size:0.88rem; color:var(--text-muted); margin:0.4rem 0 0.75rem; line-height:1.5; }
  .leader-card .term-badge {
    display:inline-block; padding:0.2rem 0.65rem; border-radius:20px;
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.02em;
  }
  .term-badge-current { background:#eaf4ec; color:#1f4b3f; }
  .term-badge-past { background:#e9edf3; color:#4a5568; }

  .term-section { margin-bottom:2.5rem; }
  .term-section:last-child { margin-bottom:0; }
  .term-header {
    display:flex; align-items:baseline; gap:0.75rem; flex-wrap:wrap;
    margin-bottom:1.25rem; padding-bottom:0.6rem; border-bottom:2px solid var(--border);
  }
  .term-header h3 { margin:0; font-size:1.15rem; }
  .term-header .term-date { color:var(--text-muted); font-size:0.85rem; }

  .empty-state { text-align:center; padding:2rem 0; color:var(--text-muted); grid-column:1/-1; }
  .empty-state p { font-size:0.95rem; }

  .leader-details-btn { cursor: pointer; }
  #leader-detail-modal {
    position: fixed; inset: 0; z-index: 12000;
    background: rgba(10, 18, 28, 0.55);
    display: none; align-items: center; justify-content: center;
    padding: 1rem;
  }
  #leader-detail-modal.open { display: flex; }
  .leader-detail-card {
    background: var(--paper, #fff);
    border-radius: 14px;
    border: 1px solid var(--border, #ddd);
    box-shadow: 0 20px 60px rgba(0,0,0,0.28);
    max-width: 440px; width: 100%;
    max-height: min(88vh, 640px);
    overflow: auto;
    padding: 1.25rem 1.35rem 1.4rem;
    position: relative;
  }
  .leader-detail-close {
    position: absolute; top: 0.65rem; right: 0.7rem;
    border: none; background: transparent; font-size: 1.4rem;
    cursor: pointer; color: var(--text-muted, #666); line-height: 1;
  }
  .leader-detail-hero {
    display: flex; gap: 0.9rem; align-items: center; margin-bottom: 0.9rem;
  }
  .leader-detail-avatar {
    width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--gold, #c9a227); flex-shrink: 0; background: #eee;
  }
  .leader-detail-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .leader-detail-hero h3 { margin: 0 0 0.2rem; font-size: 1.15rem; }
  .leader-detail-role { margin: 0; color: var(--forest, #1f4b3f); font-weight: 600; font-size: 0.9rem; }
  .leader-detail-term { margin: 0.25rem 0 0; font-size: 0.8rem; color: var(--text-muted, #666); }
  .leader-detail-about { font-size: 0.9rem; line-height: 1.5; color: var(--text, #222); margin: 0 0 1rem; }
  .leader-detail-about.muted { color: var(--text-muted, #777); font-style: italic; }
  .leader-detail-grid { display: grid; gap: 0.55rem; margin: 0; }
  .leader-detail-grid div {
    display: grid; grid-template-columns: 120px 1fr; gap: 0.4rem;
    border-top: 1px solid var(--border, #eee); padding-top: 0.45rem;
  }
  .leader-detail-grid dt { margin: 0; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .leader-detail-grid dd { margin: 0; font-size: 0.9rem; }

<body>
<div id="app-nav"></div>

<div class="section">
  <div class="section-head">
    <span class="eyebrow">Who leads us</span>
    <h2>Executive Committee: All Terms</h2>
    <p style="color:var(--text-muted);">Every term, members vote in a new executive committee. Current and past leadership teams are listed here for transparency and continuity.</p>
  </div>

  <div id="current-leaders-section" class="term-section">
    <div class="term-header">
      <h3 id="current-term-heading">Current Term</h3>
    </div>
    <div class="leader-grid" id="current-leaders-grid">
      <div class="empty-state"><p>Loading current leaders...</p></div>
    </div>
  </div>

  <div id="past-leaders-section" class="term-section">
    <div class="term-header">
      <h3>Previous Terms</h3>
    </div>
    <div id="past-leaders-container"></div>
  </div>
</div>

<div id="app-footer"></div>

<div id="leader-detail-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="leader-detail-title">
  <div class="leader-detail-card">
    <button type="button" class="leader-detail-close" data-close-leader-detail aria-label="Close">&times;</button>
    <div id="leader-detail-body"></div>
  </div>
</div>


<script type="module">
  import { supabase, publicSupabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { requireApprovedMember } from './assets/js/session-guard.js';

  // Full leadership directory is members-only
  const member = await requireApprovedMember();
  if (!member) throw new Error('redirecting');

  mountNav();
  mountFooter();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase()).join('');
  }

  
  function normName(s) {
    return (s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function namesLooselyMatch(a, b) {
    const na = normName(a);
    const nb = normName(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const wa = na.split(' ').filter(Boolean);
    const wb = nb.split(' ').filter(Boolean);
    if (wa.length >= 2 && wb.length >= 2) {
      const setB = new Set(wb);
      const overlap = wa.filter(w => setB.has(w) || [...setB].some(x => x.startsWith(w.slice(0, 4)) || w.startsWith(x.slice(0, 4))));
      if (overlap.length >= Math.min(2, wa.length, wb.length)) return true;
      const lastA = wa[wa.length - 1], lastB = wb[wb.length - 1];
      if (lastA.length >= 5 && lastA === lastB) return true;
    }
    return false;
  }

  /** Load profile photos via security-definer RPC (works for public visitors). */
  async function enrichLeadersFromProfiles(leaders) {
    if (!leaders?.length) return leaders || [];
    const ids = [...new Set(leaders.map(l => l.user_id).filter(Boolean))];
    const names = [...new Set(leaders.map(l => (l.full_name || '').trim()).filter(Boolean))];
    let rows = [];
    try {
      const { data, error } = await publicSupabase.rpc('get_leader_display_photos', {
        p_ids: ids.length ? ids : null,
        p_names: names.length ? names : null,
      });
      if (!error && data) rows = data;
    } catch (_) {}
    // Always try to attach faculty/hostel (and fill gaps) from profiles for known user ids
    if (ids.length) {
      try {
        const { data: scopeRows } = await supabase.from('profiles').select('id, full_name, avatar_url, faculty, hostel, programme, year_of_study, academic_year, bio, phone, email, registration_number').in('id', ids);
        if (scopeRows && scopeRows.length) {
          const byScope = new Map(scopeRows.map(p => [p.id, p]));
          if (rows.length) {
            rows = rows.map(r => {
              const s = byScope.get(r.user_id);
              return s ? { ...r, faculty: s.faculty, hostel: s.hostel, full_name: r.full_name || s.full_name, avatar_url: r.avatar_url || s.avatar_url, programme: s.programme, year_of_study: s.year_of_study, academic_year: s.academic_year, profile_bio: s.bio, phone: s.phone, email: s.email, registration_number: s.registration_number } : r;
            });
          } else {
            rows = scopeRows.map(p => ({ user_id: p.id, full_name: p.full_name, avatar_url: p.avatar_url, faculty: p.faculty, hostel: p.hostel, programme: p.programme, year_of_study: p.year_of_study, academic_year: p.academic_year, profile_bio: p.bio, phone: p.phone, email: p.email, registration_number: p.registration_number }));
          }
        }
      } catch (_) {}
    }
    // Fallback: direct profiles select (works for logged-in members/admins)
    if (!rows.length) {
      try {
        let q = supabase.from('profiles').select('id, full_name, avatar_url, faculty, hostel, programme, year_of_study, academic_year, bio, phone, email, registration_number');
        if (ids.length) {
          const { data } = await q.in('id', ids);
          rows = (data || []).map(p => ({ user_id: p.id, full_name: p.full_name, avatar_url: p.avatar_url, faculty: p.faculty, hostel: p.hostel, programme: p.programme, year_of_study: p.year_of_study, academic_year: p.academic_year, profile_bio: p.bio, phone: p.phone, email: p.email, registration_number: p.registration_number }));
        } else {
          const { data } = await q.limit(300);
          rows = (data || []).map(p => ({ user_id: p.id, full_name: p.full_name, avatar_url: p.avatar_url, faculty: p.faculty, hostel: p.hostel, programme: p.programme, year_of_study: p.year_of_study, academic_year: p.academic_year, profile_bio: p.bio, phone: p.phone, email: p.email, registration_number: p.registration_number }));
        }
      } catch (_) {}
    }
    const byId = new Map(rows.map(r => [r.user_id, r]));
    const byName = rows;
    return leaders.map(l => {
      let hit = l.user_id ? byId.get(l.user_id) : null;
      if (!hit && (l.full_name || '').trim()) {
        hit = byName.find(r => namesLooselyMatch(r.full_name, l.full_name));
      }
      return {
        ...l,
        full_name: (l.full_name && l.full_name.trim()) || hit?.full_name || null,
        avatar_url: l.photo_url || hit?.avatar_url || null,
        faculty: l.faculty || hit?.faculty || null,
        hostel: l.hostel || hit?.hostel || null,
        programme: l.programme || hit?.programme || null,
        year_of_study: l.year_of_study || hit?.year_of_study || null,
        academic_year: l.academic_year || hit?.academic_year || null,
        profile_bio: l.profile_bio || hit?.profile_bio || hit?.bio || null,
        phone: l.phone || hit?.phone || null,
        email: l.email || hit?.email || null,
        registration_number: l.registration_number || hit?.registration_number || null,
      };
    });
  }


  /** Faculty / Hall reps show the unit they represent, e.g. "Agriculture Faculty Representative / Coordinator". */
  function formatLeaderPosition(position, faculty, hostel) {
    const pos = (position || '').trim();
    const pl = pos.toLowerCase();
    if (pl.includes('faculty')) {
      const f = (faculty || '').trim();
      if (!f) return pos;
      const hasFacultyWord = /\bfaculty\b/i.test(f);
      const unit = hasFacultyWord ? f : (f + ' Faculty');
      return unit + ' Representative / Coordinator';
    }
    if (pl.includes('hall') || pl.includes('hostel')) {
      const h = (hostel || '').trim();
      if (!h) return pos;
      if (/\b(hall|hostel)\b/i.test(h)) return h + ' Representative';
      return h + ' Hall/Hostel Representative';
    }
    return pos;
  }

  const leaderByKey = new Map();

  function leaderCardHtml(leader, isCurrent = true) {
    const name = leader.full_name || 'Unknown Member';
    const photoUrl = leader.avatar_url || null;
    const bio = leader.bio || '';
    const positionLabel = formatLeaderPosition(leader.position, leader.faculty, leader.hostel);
    const badgeClass = isCurrent ? 'term-badge-current' : 'term-badge-past';
    const badgeLabel = isCurrent
      ? (typeof expectedTerm !== 'undefined' ? expectedTerm : (leader.term_label || 'Current'))
      : (leader.term_label || 'Past Term');

    const key = leader.id || `${leader.user_id || name}-${leader.position || ''}`;
    leaderByKey.set(String(key), { ...leader, _isCurrent: isCurrent, _positionLabel: positionLabel, _badgeLabel: badgeLabel });

    const ini = initials(name);
    const avatarContent = photoUrl
      ? `<img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-fallback',textContent:'${ini}'}));" />`
      : `<div class="avatar-fallback">${ini}</div>`;

    return `
      <div class="leader-card">
        <div class="avatar-wrap">${avatarContent}</div>
        <h3>${escapeHtml(name)}</h3>
        <div class="position-label">${escapeHtml(positionLabel)}</div>
        ${bio ? `<div class="bio">${escapeHtml(bio)}</div>` : ''}
        <span class="term-badge ${badgeClass}">${badgeLabel}</span>
        <button type="button" class="btn btn-outline leader-details-btn" data-leader-key="${escapeHtml(String(key))}" style="margin-top:0.85rem;width:100%;font-size:0.85rem;">View details</button>
      </div>
    `;
  }

  function openLeaderDetails(key) {
    const leader = leaderByKey.get(String(key));
    if (!leader) return;
    const name = leader.full_name || 'Unknown Member';
    const photoUrl = leader.avatar_url || null;
    const ini = initials(name);
    const rows = [
      ['Position', leader._positionLabel || leader.position],
      ['Term', leader._badgeLabel || leader.term_label],
      ['Faculty', leader.faculty],
      ['Hall / Hostel', leader.hostel],
      ['Programme', leader.programme],
      ['Year of study', leader.year_of_study],
      ['Academic year', leader.academic_year],
      ['Registration no.', leader.registration_number],
      ['Email', leader.email],
      ['Phone', leader.phone],
    ].filter(([, v]) => v !== null && v !== undefined && String(v).trim() !== '');

    const termDates = [];
    if (leader.term_start) termDates.push('From ' + new Date(leader.term_start).toLocaleDateString());
    if (leader.term_end) termDates.push('To ' + new Date(leader.term_end).toLocaleDateString());

    const about = leader.bio || leader.profile_bio || '';
    const avatar = photoUrl
      ? `<img src="${escapeHtml(photoUrl)}" alt="" />`
      : `<div class="avatar-fallback" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;">${ini}</div>`;

    const modal = document.getElementById('leader-detail-modal');
    document.getElementById('leader-detail-body').innerHTML = `
      <div class="leader-detail-hero">
        <div class="leader-detail-avatar">${avatar}</div>
        <div>
          <h3 id="leader-detail-title">${escapeHtml(name)}</h3>
          <p class="leader-detail-role">${escapeHtml(leader._positionLabel || leader.position || '')}</p>
          ${termDates.length ? `<p class="leader-detail-term">${escapeHtml(termDates.join(' · '))}</p>` : ''}
        </div>
      </div>
      ${about ? `<p class="leader-detail-about">${escapeHtml(about)}</p>` : '<p class="leader-detail-about muted">No biography submitted yet.</p>'}
      <dl class="leader-detail-grid">
        ${rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v))}</dd></div>`).join('')}
      </dl>
    `;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeLeaderDetails() {
    const modal = document.getElementById('leader-detail-modal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-leader-key]');
    if (btn) {
      openLeaderDetails(btn.dataset.leaderKey);
      return;
    }
    if (e.target.id === 'leader-detail-modal' || e.target.closest('[data-close-leader-detail]')) {
      closeLeaderDetails();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLeaderDetails();
  });

  // -----------------------------------------------------------------------
  // 1. Load current-term leaders
  // -----------------------------------------------------------------------
  const currentGrid = document.getElementById('current-leaders-grid');
  const pastContainer = document.getElementById('past-leaders-container');

  const TERM_START_MD = { month: 7, day: 24 }; // 24 Aug (0-based month)
  const TERM_END_MD = { month: 7, day: 23 };   // 23 Aug next year

  function leadershipTermLabel(refDate = new Date()) {
    const y = refDate.getFullYear();
    const m = refDate.getMonth();
    const d = refDate.getDate();
    // Before 24 Aug → term that started previous Aug (e.g. in Jan 2026 → 2025/26)
    const startYear = (m > 7 || (m === 7 && d >= 24)) ? y : y - 1;
    return `${startYear}/${String(startYear + 1).slice(-2)}`;
  }

  function termWindowForLabel(label) {
    // label "2025/26" → start 2025-08-24, end 2026-08-23
    const startY = parseInt(String(label).split('/')[0], 10);
    if (!startY) return null;
    const start = `${startY}-08-24`;
    const end = `${startY + 1}-08-23`;
    return { start, end };
  }

  // Soft rollover: if marked current but past term_end, treat as past
  async function applyTermRollover(rows) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const toArchive = (rows || []).filter(l => {
      if (!l.is_current || !l.term_end) return false;
      const end = new Date(l.term_end + 'T23:59:59');
      return end < today;
    });
    if (!toArchive.length) return rows || [];
    const ids = toArchive.map(l => l.id);
    try {
      await supabase.from('leaders').update({ is_current: false }).in('id', ids);
    } catch (_) {}
    return (rows || []).map(l => ids.includes(l.id) ? { ...l, is_current: false } : l);
  }

  const expectedTerm = leadershipTermLabel();
  const win = termWindowForLabel(expectedTerm);

  // Update header label
  const termHdr = document.querySelector('#current-leaders-section .term-header h3');
  if (termHdr) termHdr.textContent = `Current Term · ${expectedTerm}`;

  async function fetchAllLeaders() {
    // Prefer public (no session JWT) so a skewed phone clock / bad token cannot block the page
    const clients = [publicSupabase, supabase];
    let lastErr = null;
    for (const client of clients) {
      const { data, error } = await client
        .from('leaders')
        .select('id, user_id, position, bio, term_start, term_end, display_order, full_name, term_label, photo_url, is_current')
        .order('display_order');
      if (!error) return { data: data || [], error: null };
      lastErr = error;
      // Retry next client on auth/JWT clock issues
      if (!/JWT|issued at future|session|token|expir/i.test(error.message || '')) {
        return { data: null, error };
      }
    }
    return { data: null, error: lastErr };
  }

  let { data: allLeaders, error: currentErr } = await fetchAllLeaders();

  if (!currentErr && allLeaders) {
    try {
      allLeaders = await applyTermRollover(allLeaders);
    } catch (_) {
      // Rollover is best-effort; never block the page
    }
  }

  function termMatchesExpected(label, expected) {
    const lab = (label || '').trim();
    if (!lab) return false;
    if (lab === expected) return true;
    // Accept "2026/2027" style as well as "2026/27"
    const ey = expected.split('/')[0];
    const parts = lab.split('/');
    if (parts[0] === ey) {
      const end = (parts[1] || '').replace(/^20/, '');
      const expEnd = (expected.split('/')[1] || '').replace(/^20/, '');
      return !parts[1] || end === expEnd || parts[1] === expected.split('/')[1];
    }
    return false;
  }

  // STRICT: only leaders for THIS academic year appear under Current
  let currentLeaders = (allLeaders || []).filter(l =>
    l.is_current && termMatchesExpected(l.term_label, expectedTerm)
  );
  // Rows marked is_current but belonging to an older term → treat as past for display
  const staleCurrent = (allLeaders || []).filter(l =>
    l.is_current && !termMatchesExpected(l.term_label, expectedTerm)
  );

  
  // Soft-archive leaders still marked current but for a previous term year
  if (typeof staleCurrent !== 'undefined' && staleCurrent.length) {
    const staleIds = staleCurrent.map(l => l.id).filter(Boolean);
    if (staleIds.length) {
      try {
        await supabase.from('leaders').update({ is_current: false }).in('id', staleIds);
      } catch (_) {}
    }
  }

  if (!currentErr && currentLeaders.length) {
    currentLeaders = await enrichLeadersFromProfiles(currentLeaders);
    // Hide incomplete rows (no name) and de-dupe by position
    const byPos = new Map();
    for (const l of currentLeaders) {
      const name = (l.full_name || '').trim();
      if (!name) continue;
      const key = (l.position || '').trim().toLowerCase() || l.id;
      const prev = byPos.get(key);
      if (!prev || ((l.photo_url || l.avatar_url) && !(prev.photo_url || prev.avatar_url))) {
        byPos.set(key, l);
      }
    }
    currentLeaders = [...byPos.values()].sort((a, b) => (a.display_order || 99) - (b.display_order || 99));
  }

  if (currentErr) {
    const msg = currentErr.message || '';
    const clockHint = /JWT|issued at future|clock/i.test(msg)
      ? ' Your device clock may be wrong — set the correct date and time, then refresh.'
      : '';
    currentGrid.innerHTML = `<div class="empty-state"><p>Could not load current leaders.${escapeHtml(clockHint || ' ' + msg)}</p></div>`;
  } else if (!currentLeaders || currentLeaders.length === 0) {
    currentGrid.innerHTML = `<div class="empty-state" style="border-color:#f59e0b;background:#fffbeb;">
      <p style="color:#92400e;font-weight:600;">No current leadership published for ${escapeHtml(expectedTerm)}.</p>
      <p style="color:var(--text-muted);margin-top:0.5rem;">Waiting for elections (or an admin to add the new executive committee). Previous terms are listed below when available.</p>
    </div>`;
  } else {
    currentGrid.innerHTML = currentLeaders.map(l => leaderCardHtml(l, true)).join('');
  }

  // -----------------------------------------------------------------------
  // 2. Load past-term leaders
  // -----------------------------------------------------------------------
  // Past = not current, plus stale "current" rows from previous academic years
  let pastLeaders = (allLeaders || []).filter(l =>
    !l.is_current || (l.is_current && !termMatchesExpected(l.term_label, expectedTerm))
  );
  // Prefer dedicated past query order when available
  const { data: pastRows, error: pastErr } = await supabase
    .from('leaders')
    .select('id, user_id, position, bio, term_start, term_end, display_order, full_name, term_label, photo_url, is_current')
    .order('term_start', { ascending: false })
    .order('display_order');
  if (!pastErr && pastRows) {
    pastLeaders = pastRows.filter(l =>
      !l.is_current || !termMatchesExpected(l.term_label, expectedTerm)
    );
  }
  if (pastLeaders && pastLeaders.length) {
    pastLeaders = await enrichLeadersFromProfiles(pastLeaders);
  }

  if (pastErr) {
    pastContainer.innerHTML = `<div class="empty-state"><p>Could not load previous terms. ${escapeHtml(pastErr.message)}</p></div>`;
  } else if (!pastLeaders || pastLeaders.length === 0) {
    pastContainer.innerHTML = `<div class="empty-state"><p>No previous terms yet: this is the association's first leadership term. Future committees will be listed here after each election cycle.</p></div>`;
  } else {
    // Group past leaders by term (using term_start as the grouping key)
    const termGroups = {};
    for (const leader of pastLeaders) {
      const key = leader.term_start ? leader.term_start.slice(0, 7) : 'unknown';
      if (!termGroups[key]) {
        termGroups[key] = {
          term_start: leader.term_start,
          term_end: leader.term_end,
          leaders: [],
        };
      }
      termGroups[key].leaders.push(leader);
    }

    const sortedTerms = Object.entries(termGroups).sort((a, b) => {
      // Sort most-recent term first
      return (b[1].term_start || '').localeCompare(a[1].term_start || '');
    });

    pastContainer.innerHTML = sortedTerms.map(([key, group]) => {
      const startDate = group.term_start ? new Date(group.term_start).toLocaleDateString('en-US', { year: 'numeric', month: 'short' }) : 'Unknown start';
      const endDate = group.term_end ? new Date(group.term_end).toLocaleDateString('en-US', { year: 'numeric', month: 'short' }) : 'Present';
      return `
        <div class="term-section">
          <div class="term-header">
            <h3>${startDate} - ${endDate}</h3>
            <span class="term-date">${group.leaders.length} position(s)</span>
          </div>
          <div class="leader-grid">
            ${group.leaders.map(l => leaderCardHtml(l, false)).join('')}
          </div>
        </div>
      `;
    }).join('');
  }
</script>
</body>
</html>
