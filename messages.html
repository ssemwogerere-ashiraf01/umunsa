<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Messages: Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .msg-shell {
    max-width: 1100px; margin: 1rem auto 2rem; padding: 0 1rem;
    display: grid; grid-template-columns: 280px 1fr; gap: 1rem; min-height: 70vh;
  }
  @media (max-width: 800px) {
    .msg-shell { grid-template-columns: 1fr; min-height: auto; }
    .msg-sidebar { max-height: 40vh; }
  }
  .msg-panel {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .msg-sidebar { max-height: 75vh; }
  .msg-side-head, .msg-chat-head {
    padding: 0.9rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.75rem;
  }
  .msg-side-head h2, .msg-chat-head h2 { margin: 0; font-size: 1.05rem; }
  .msg-tabs { display: flex; gap: 0.35rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
  .msg-tab {
    flex: 1; border: none; background: transparent; padding: 0.45rem;
    border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted);
  }
  .msg-tab.active { background: var(--forest); color: #fff; }
  .msg-list { overflow-y: auto; flex: 1; }
  .msg-person {
    width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--border);
    background: transparent; padding: 0.75rem 1rem; cursor: pointer; display: flex; gap: 0.65rem; align-items: center;
  }
  .msg-person:hover, .msg-person.active { background: rgba(27,67,50,0.06); }
  .msg-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--forest); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-person-name { font-weight: 700; font-size: 0.92rem; color: var(--ink-navy); }
  .msg-person-sub { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .msg-chat { min-height: 60vh; max-height: 75vh; }
  .msg-thread { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.65rem; background: #f7f5f0; }
  .msg-bubble {
    max-width: 78%; padding: 0.65rem 0.85rem; border-radius: 14px; font-size: 0.92rem; line-height: 1.4;
    word-break: break-word;
  }
  .msg-bubble.mine { align-self: flex-end; background: var(--forest); color: #fff; border-bottom-right-radius: 4px; }
  .msg-bubble.theirs { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 0.7rem; opacity: 0.75; margin-top: 0.25rem; }
  .msg-composer {
    border-top: 1px solid var(--border); padding: 0.65rem; display: flex; flex-direction: column; gap: 0.4rem;
    background: var(--paper); position: relative;
  }
  .msg-composer-row { display: flex; gap: 0.5rem; align-items: flex-end; }
  .msg-composer textarea {
    flex: 1; min-height: 44px; max-height: 120px; resize: vertical;
    border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.75rem;
    font-family: inherit; background: #fff; color: var(--text);
  }
  .msg-icon-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    width: 42px; height: 42px; cursor: pointer; font-size: 1.2rem;
  }
  .msg-send {
    background: var(--forest); color: #fff; border: none; border-radius: 10px;
    padding: 0 1rem; height: 42px; font-weight: 700; cursor: pointer;
  }
  .msg-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .emoji-pop {
    display: none; position: absolute; bottom: 100%; left: 0.5rem; right: 0.5rem;
    max-height: 220px; overflow-y: auto; background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); padding: 0.5rem; z-index: 5;
  }
  .emoji-pop.open { display: block; }
  .emoji-cat { font-size: 0.75rem; font-weight: 700; color: #c2410c; margin: 0.35rem 0 0.25rem; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 0.15rem; }
  .emoji-grid button {
    border: none; background: transparent; font-size: 1.25rem; width: 2rem; height: 2rem;
    cursor: pointer; border-radius: 6px;
  }
  .emoji-grid button:hover { background: #f3f4f6; }
  .notes-box { flex: 1; padding: 1rem; display: none; flex-direction: column; gap: 0.75rem; }
  .notes-box.open { display: flex; }
  .notes-box textarea {
    flex: 1; min-height: 200px; border: 1px solid var(--border); border-radius: 12px;
    padding: 0.75rem; font-family: inherit; resize: vertical;
  }
  .msg-empty { color: var(--text-muted); text-align: center; padding: 2rem 1rem; }
  .msg-search {
    margin: 0.5rem 0.75rem; padding: 0.45rem 0.65rem; border: 1px solid var(--border);
    border-radius: 8px; width: calc(100% - 1.5rem); font-family: inherit;
  }
</style>
</head>
<body>
<div id="app-nav"></div>

<div class="section" style="padding-bottom:0;">
  <div class="section-head" style="text-align:left;margin-left:0;">
    <span class="eyebrow">Members</span>
    <h2 style="margin:0;">Messages</h2>
    <p style="color:var(--text-muted);max-width:640px;">Chat with other active members. Use Personal space to keep private notes and drafts.</p>
  </div>
</div>

<div class="msg-shell">
  <aside class="msg-panel msg-sidebar">
    <div class="msg-side-head"><h2>Inbox</h2></div>
    <div class="msg-tabs">
      <button type="button" class="msg-tab active" data-tab="chats">Chats</button>
      <button type="button" class="msg-tab" data-tab="notes">Personal space</button>
    </div>
    <div id="chats-pane">
      <input type="search" class="msg-search" id="member-search" placeholder="Search members..." />
      <div class="msg-list" id="member-list"><div class="msg-empty">Loading members...</div></div>
    </div>
  </aside>

  <section class="msg-panel msg-chat" id="chat-panel">
    <div class="msg-chat-head" id="chat-head">
      <div class="msg-avatar" id="chat-avatar">?</div>
      <div>
        <h2 id="chat-title">Select a member</h2>
        <div style="font-size:0.8rem;color:var(--text-muted);" id="chat-sub">Start a conversation</div>
      </div>
    </div>

    <div class="msg-thread" id="thread"><div class="msg-empty">Choose someone on the left to message them.</div></div>

    <div class="msg-composer" id="composer" style="display:none;">
      <div class="emoji-pop" id="emoji-pop" aria-hidden="true"></div>
      <div class="msg-composer-row">
        <button type="button" class="msg-icon-btn" id="emoji-btn" title="Emoji">😊</button>
        <textarea id="message-input" rows="2" placeholder="Write a message..."></textarea>
        <button type="button" class="msg-send" id="send-btn">Send</button>
      </div>
    </div>

    <div class="notes-box" id="notes-box">
      <p style="margin:0;color:var(--text-muted);font-size:0.9rem;">Personal space — save draft messages, links, and notes. Only you can see this.</p>
      <textarea id="notes-input" placeholder="Write private notes or drafts here..."></textarea>
      <button type="button" class="btn btn-gold" id="notes-save">Save notes</button>
      <div id="notes-status" style="font-size:0.8rem;color:var(--text-muted);"></div>
    </div>
  </section>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { requireApprovedMember } from './assets/js/session-guard.js';

  mountNav('messages');
  mountFooter();

  const me = await requireApprovedMember();
  if (!me) throw new Error('redirect');

  const EMOJIS = {
    'Smileys & emotion': ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','😡','😠','🤬','😷','🤒','🤕','🤢','🤮','🤧','😇','🥳','🥺','🤠','🤡','🤥'],
    'Gestures': ['👍','👎','👏','🙌','👐','🤝','🙏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐','🖖','👋','💪','🦾'],
    'Hearts': ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝'],
  };

  const emojiPop = document.getElementById('emoji-pop');
  const emojiBtn = document.getElementById('emoji-btn');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const thread = document.getElementById('thread');
  const memberList = document.getElementById('member-list');
  const composer = document.getElementById('composer');
  const notesBox = document.getElementById('notes-box');
  const chatsPane = document.getElementById('chats-pane');

  let members = [];
  let activeId = null;
  let pollTimer = null;

  // Build emoji panel
  for (const [cat, list] of Object.entries(EMOJIS)) {
    const h = document.createElement('div');
    h.className = 'emoji-cat';
    h.textContent = cat;
    emojiPop.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'emoji-grid';
    for (const em of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = em;
      b.addEventListener('click', () => {
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        input.value = input.value.slice(0, start) + em + input.value.slice(end);
        input.focus();
        input.selectionStart = input.selectionEnd = start + em.length;
      });
      grid.appendChild(b);
    }
    emojiPop.appendChild(grid);
  }

  emojiBtn.addEventListener('click', () => {
    emojiPop.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!emojiPop.contains(e.target) && e.target !== emojiBtn) emojiPop.classList.remove('open');
  });

  function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase()).join('');
  }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }
  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  // Tabs
  document.querySelectorAll('.msg-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.msg-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const mode = tab.dataset.tab;
      if (mode === 'notes') {
        chatsPane.style.display = 'none';
        thread.style.display = 'none';
        composer.style.display = 'none';
        document.getElementById('chat-head').style.display = 'none';
        notesBox.classList.add('open');
        loadNotes();
      } else {
        chatsPane.style.display = 'block';
        notesBox.classList.remove('open');
        document.getElementById('chat-head').style.display = 'flex';
        thread.style.display = 'flex';
        if (activeId) composer.style.display = 'flex';
      }
    });
  });

  async function loadMembers() {
    const { data, error } = await supabase
      .from('profiles')
      .select('id, full_name, email, avatar_url, role')
      .eq('membership_status', 'active')
      .neq('id', me.id)
      .order('full_name');
    if (error) {
      memberList.innerHTML = `<div class="msg-empty">${escapeHtml(error.message)}</div>`;
      return;
    }
    members = data || [];
    renderMembers();
  }

  function renderMembers(filter = '') {
    const q = filter.trim().toLowerCase();
    const list = members.filter(m => {
      if (!q) return true;
      return (m.full_name || '').toLowerCase().includes(q) || (m.email || '').toLowerCase().includes(q);
    });
    if (!list.length) {
      memberList.innerHTML = `<div class="msg-empty">No members found.</div>`;
      return;
    }
    memberList.innerHTML = list.map(m => `
      <button type="button" class="msg-person ${m.id === activeId ? 'active' : ''}" data-id="${m.id}">
        <div class="msg-avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="" />` : escapeHtml(initials(m.full_name))}</div>
        <div style="min-width:0;">
          <div class="msg-person-name">${escapeHtml(m.full_name || 'Member')}</div>
          <div class="msg-person-sub">${escapeHtml(m.email || '')}</div>
        </div>
      </button>
    `).join('');
    memberList.querySelectorAll('.msg-person').forEach(btn => {
      btn.addEventListener('click', () => openChat(btn.dataset.id));
    });
  }

  document.getElementById('member-search').addEventListener('input', (e) => {
    renderMembers(e.target.value);
  });

  async function openChat(userId) {
    activeId = userId;
    const person = members.find(m => m.id === userId);
    renderMembers(document.getElementById('member-search').value);
    document.getElementById('chat-title').textContent = person?.full_name || 'Member';
    document.getElementById('chat-sub').textContent = person?.email || '';
    const av = document.getElementById('chat-avatar');
    if (person?.avatar_url) av.innerHTML = `<img src="${escapeHtml(person.avatar_url)}" alt="" />`;
    else av.textContent = initials(person?.full_name);
    composer.style.display = 'flex';
    notesBox.classList.remove('open');
    document.querySelectorAll('.msg-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'chats'));
    chatsPane.style.display = 'block';
    thread.style.display = 'flex';
    document.getElementById('chat-head').style.display = 'flex';
    await loadThread();
    clearInterval(pollTimer);
    pollTimer = setInterval(loadThread, 8000);
  }

  async function loadThread() {
    if (!activeId) return;
    const { data, error } = await supabase
      .from('direct_messages')
      .select('id, sender_id, recipient_id, body, created_at')
      .or(`and(sender_id.eq.${me.id},recipient_id.eq.${activeId}),and(sender_id.eq.${activeId},recipient_id.eq.${me.id})`)
      .order('created_at', { ascending: true })
      .limit(200);
    if (error) {
      thread.innerHTML = `<div class="msg-empty">${escapeHtml(error.message)}</div>`;
      return;
    }
    if (!data?.length) {
      thread.innerHTML = `<div class="msg-empty">No messages yet. Say hello.</div>`;
      return;
    }
    thread.innerHTML = data.map(m => {
      const mine = m.sender_id === me.id;
      return `<div class="msg-bubble ${mine ? 'mine' : 'theirs'}">${escapeHtml(m.body)}<div class="msg-time">${formatTime(m.created_at)}</div></div>`;
    }).join('');
    thread.scrollTop = thread.scrollHeight;

    // Mark incoming as read
    await supabase.from('direct_messages')
      .update({ read_at: new Date().toISOString() })
      .eq('recipient_id', me.id)
      .eq('sender_id', activeId)
      .is('read_at', null);
  }

  async function sendMessage() {
    const body = input.value.trim();
    if (!body || !activeId) return;
    sendBtn.disabled = true;
    const { error } = await supabase.from('direct_messages').insert({
      sender_id: me.id,
      recipient_id: activeId,
      body,
    });
    sendBtn.disabled = false;
    if (error) {
      alert(error.message);
      return;
    }
    input.value = '';
    await loadThread();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function loadNotes() {
    const { data } = await supabase.from('personal_notes').select('content').eq('user_id', me.id).maybeSingle();
    document.getElementById('notes-input').value = data?.content || '';
  }

  document.getElementById('notes-save').addEventListener('click', async () => {
    const content = document.getElementById('notes-input').value;
    const { error } = await supabase.from('personal_notes').upsert({
      user_id: me.id,
      content,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id' });
    document.getElementById('notes-status').textContent = error ? error.message : 'Saved.';
  });

  await loadMembers();
</script>
</body>
</html>
