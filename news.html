<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News: Nkobazambogo Students' Association</title>
<meta name="description" content="Announcements and news from the Nkobazambogo Students' Association." />
<meta property="og:site_name" content="Nkobazambogo Students' Association" />
<meta property="og:type" content="website" />
<meta property="og:title" content="News: Nkobazambogo Students' Association" />
<meta property="og:description" content="Announcements and news from the Nkobazambogo Students' Association." />
<meta property="og:url" content="https://umunsa.vercel.app/news.html" />
<meta property="og:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.25rem; margin-top:1.5rem; }
  .news-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; display:flex; flex-direction:column;
    text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease;
  }
  .news-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .news-card .media { width:100%; height:180px; background:#e8e4dc; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .news-card .media img { width:100%; height:100%; object-fit:cover; }
  .news-card .media .doc-badge {
    display:flex; flex-direction:column; align-items:center; gap:0.35rem; color:var(--text-muted); font-size:0.85rem;
  }
  .news-card .body { padding: 1rem 1.1rem 1.15rem; }
  .news-card h3 { margin: 0 0 0.35rem; font-size: 1.05rem; color: var(--ink-navy); line-height:1.3; }
  .news-meta { font-size: 0.78rem; color: var(--text-muted); }
  .news-empty { text-align:center; color:var(--text-muted); padding:3rem 0; }
</style>
</head>
<body>
<div id="app-nav"></div>
<div class="section">
  <div class="section-head">
    <h1>News &amp; Announcements</h1>
    <p>What's happening across the Nkobazambogo Students' Association.</p>
  </div>
  <div id="news-container" class="news-grid"><div class="news-empty">Loading news...</div></div>
</div>
<div id="app-footer"></div>
<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav('news');
  mountFooter();
  const container = document.getElementById('news-container');
  function escapeHtml(str) {
    const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
  }
  const { data, error } = await supabase
    .from('news')
    .select('id, title, image_url, document_url, published_at')
    .order('published_at', { ascending: false });
  if (error) {
    container.innerHTML = `<div class="news-empty">${escapeHtml(error.message)}</div>`;
  } else if (!data?.length) {
    container.innerHTML = `<div class="news-empty">No news posted yet. Check back soon!</div>`;
  } else {
    container.innerHTML = data.map(n => {
      let media = '';
      if (n.image_url) media = `<div class="media"><img src="${escapeHtml(n.image_url)}" alt="" loading="lazy" /></div>`;
      else if (n.document_url) media = `<div class="media"><div class="doc-badge"><span style="font-size:2rem;">📄</span><span>Document attached</span></div></div>`;
      else media = `<div class="media"><div class="doc-badge"><span style="font-size:2rem;">📰</span></div></div>`;
      return `<a class="news-card" href="news-detail.html?id=${encodeURIComponent(n.id)}">
        ${media}
        <div class="body">
          <h3>${escapeHtml(n.title)}</h3>
          <div class="news-meta">${new Date(n.published_at).toLocaleDateString()}</div>
        </div>
      </a>`;
    }).join('');
  }
</script>
</body>
</html>
