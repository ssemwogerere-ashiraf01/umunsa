<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News: Nkobazambogo Students' Association</title>
<meta name="description" content="Announcements and news from the Nkobazambogo Students" />
<!-- Social / Open Graph (link previews) -->
<meta property="og:site_name" content="Nkobazambogo Students' Association" />
<meta property="og:type" content="website" />
<meta property="og:title" content="News: Nkobazambogo Students' Association" />
<meta property="og:description" content="Announcements and news from the Nkobazambogo Students" />
<meta property="og:url" content="https://umunsa.vercel.app/news.html" />
<meta property="og:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" />
<meta property="og:image:secure_url" content="https://umunsa.vercel.app/assets/img/og-default.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Nkobazambogo Students' Association" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="News: Nkobazambogo Students' Association" />
<meta name="twitter:description" content="Announcements and news from the Nkobazambogo Students" />
<meta name="twitter:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" />

<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .page-header { background: var(--paper); border-bottom: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; }
  .page-header h1 { margin: 0 0 0.25rem; font-size: 1.8rem; }
  .page-header p { color: var(--text-muted); margin: 0; }
  .news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.5rem; margin-top:2rem; }
  .news-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display:flex; flex-direction:column; }
  .news-card img { width:100%; height:170px; object-fit:cover; }
  .news-card .body { padding: 1.25rem; flex:1; }
  .news-card h3 { margin: 0 0 0.4rem; font-size: 1.1rem; }
  .news-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .featured-tag { display:inline-block; background:var(--gold); color:var(--ink-navy); font-size:0.7rem; font-weight:700; padding:0.15rem 0.5rem; border-radius:10px; margin-bottom:0.5rem; }
  .news-empty { text-align:center; color:var(--text-muted); padding:3rem 0; }
</style>
</head>
<body>
<div id="app-nav"></div>

<div class="page-header">
  <span class="eyebrow">Association</span>
  <h1>News &amp; Announcements</h1>
  <p>What's happening across the Nkobazambogo Students' Association.</p>
</div>

<div class="section" style="padding-top:0;">
  <div id="alert-box"></div>
  <div id="news-container" class="news-grid">
    <div class="news-empty">Loading news...</div>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';

  mountNav('news');
  mountFooter();

  const container = document.getElementById('news-container');
  const alertBox = document.getElementById('alert-box');

  const { data, error } = await supabase
    .from('news')
    .select('*')
    .order('is_featured', { ascending: false })
    .order('published_at', { ascending: false });

  if (error) {
    alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
    container.innerHTML = '';
  } else if (!data || !data.length) {
    container.innerHTML = `<div class="news-empty">No news posted yet. Check back soon!</div>`;
  } else {
    container.innerHTML = data.map(n => `
      <div class="news-card">
        ${n.image_url ? `<img src="${escapeHtml(n.image_url)}" alt="${escapeHtml(n.title)}" />` : ''}
        <div class="body">
          ${n.is_featured ? '<span class="featured-tag">Featured</span>' : ''}
          <h3>${escapeHtml(n.title)}</h3>
          <div class="news-meta">${new Date(n.published_at).toLocaleDateString()}</div>
          <p style="font-size:0.9rem;line-height:1.55;margin:0;">${escapeHtml(n.content)}</p>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
</script>
</body>
</html>
