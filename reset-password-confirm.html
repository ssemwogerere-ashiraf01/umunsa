<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Set New Password - Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Set a new password</h2>
    <p class="subtitle" id="subtitle">Choose a new password for your account.</p>
    <div id="alert-box"></div>
    <form id="new-pw-form">
      <div class="form-group"><label for="password">New password</label><input type="password" id="password" minlength="8" required /></div>
      <div class="form-group"><label for="confirm">Confirm password</label><input type="password" id="confirm" minlength="8" required /></div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Set Password</button>
    </form>
    <p class="form-footer"><a href="privacy">Privacy</a> &middot; <a href="terms">Terms</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav();
  mountFooter();

  // Recovery links may arrive with a PKCE `code` in the URL. Exchange that
  // for a session first; if a session is already present, keep it.
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  let session = null;

  if (code) {
    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
    if (error) {
      document.getElementById('subtitle').textContent = 'This reset link is invalid or has expired.';
      document.getElementById('new-pw-form').style.display = 'none';
      document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">${error.message}</div> <p style="text-align:center;margin-top:1rem;"><a href="reset-password.html">Request new link</a></p>`;
      throw new Error(error.message);
    }
    session = data?.session || null;
  }

  if (!session) {
    const result = await supabase.auth.getSession();
    session = result.data.session;
  }

  if (!session) {
    document.getElementById('subtitle').textContent = 'This reset link is invalid or has expired.';
    document.getElementById('new-pw-form').style.display = 'none';
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">Please request a new reset link.</div> <p style="text-align:center;margin-top:1rem;"><a href="reset-password.html">Request new link</a></p>`;
  }

  document.getElementById('new-pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (pw !== confirm) {
      alertBox.innerHTML = `<div class="alert alert-error">Passwords do not match.</div>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Saving...';

    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) {
      alertBox.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
      btn.disabled = false; btn.textContent = 'Set Password';
    } else {
      alertBox.innerHTML = `<div class="alert alert-success">Password updated. Redirecting to sign in...</div>`;
      await supabase.auth.signOut();
      setTimeout(() => window.location.href = 'login.html', 1800);
    }
  });
</script>
</body>
</html>
