<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset Password: Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="subtitle" id="subtitle">Enter the email on your membership profile. We’ll send a password reset link to your inbox.</p>
    <div id="alert-box"></div>

    <form id="reset-form">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" required autocomplete="email" placeholder="yourname@umu.ac.ug" /></div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Send reset link</button>
    </form>

    <p style="text-align:center;margin:0.8rem 0;color:var(--text-muted);">or</p>
    <div style="text-align:center;margin-bottom:0.8rem;"><button id="use-security-question" class="btn btn-outline-light">Reset using security question</button></div>

    <div id="security-reset" style="display:none;">
      <p id="sec-instruction" style="color:var(--text-muted);">Enter your email to retrieve your security question.</p>
      <div class="form-group"><label for="sec-email">Email</label><input type="email" id="sec-email" placeholder="yourname@umu.ac.ug" /></div>
      <div id="sec-question-row" style="display:none;">
        <p><strong id="sec-question"></strong></p>
        <div class="form-group"><label for="sec-answer">Answer</label><input type="text" id="sec-answer" /></div>
        <div class="form-group"><label for="sec-new-password">New password</label><input type="password" id="sec-new-password" minlength="8" /></div>
        <div class="form-group"><label for="sec-confirm-password">Confirm new password</label><input type="password" id="sec-confirm-password" minlength="8" /></div>
        <button id="sec-submit" class="btn btn-gold btn-block">Reset Password</button>
      </div>
      <div style="text-align:center;margin-top:0.6rem;"><button id="sec-cancel" class="btn btn-outline-light">Cancel</button></div>
    </div>

    <p class="form-footer"><a href="login.html">Back to Sign In</a><br /><a href="privacy">Privacy</a> &middot; <a href="terms">Terms</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { FUNCTIONS_BASE } from './assets/js/auth.js';
  mountNav();
  mountFooter();

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    btn.disabled = true; btn.textContent = 'Sending...';
    const email = document.getElementById('email').value.trim().toLowerCase();

    if (!email) {
      alertBox.innerHTML = `<div class="alert alert-error">Enter a valid email address.</div>`;
      btn.disabled = false; btn.textContent = 'Send reset link';
      return;
    }

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.location.origin}/reset-password-confirm.html`,
    });

    if (error) {
      alertBox.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
      btn.disabled = false; btn.textContent = 'Send reset link';
      return;
    }

    alertBox.innerHTML = `<div class="alert alert-success">If that email exists, a reset link has been sent. Check your inbox and spam folder.</div>`;
    btn.disabled = false; btn.textContent = 'Send reset link';
  });

  // Security-question flow
  document.getElementById('use-security-question').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('security-reset').style.display = 'block';
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('alert-box').innerHTML = '';
  });

  document.getElementById('sec-cancel').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('security-reset').style.display = 'none';
    document.getElementById('reset-form').style.display = 'block';
  });

  document.getElementById('sec-email').addEventListener('blur', async (e) => {
    const email = (e.target.value || '').trim().toLowerCase();
    const alertBox = document.getElementById('alert-box');
    if (!email) return;
    const res = await fetch(`${FUNCTIONS_BASE}/functions/v1/password-reset`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_question', email })
    });
    const data = await res.json();
    if (data && data.question) {
      document.getElementById('sec-question').textContent = data.question;
      document.getElementById('sec-question-row').style.display = 'block';
    } else {
      document.getElementById('sec-question-row').style.display = 'none';
      alertBox.innerHTML = `<div class="alert alert-success">If that email is registered and has a security question set, you'll be prompted to answer it.</div>`;
    }
  });

  document.getElementById('sec-submit').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('sec-email').value.trim().toLowerCase();
    const answer = document.getElementById('sec-answer').value || '';
    const pw = document.getElementById('sec-new-password').value || '';
    const confirm = document.getElementById('sec-confirm-password').value || '';
    const alertBox = document.getElementById('alert-box');
    if (!email || !answer || pw.length < 8 || pw !== confirm) {
      alertBox.innerHTML = `<div class="alert alert-error">Provide a valid email, answer, and matching passwords (min 8 chars).</div>`;
      return;
    }
    const res = await fetch(`${FUNCTIONS_BASE}/functions/v1/password-reset`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'confirm_question', email, answer, password: pw })
    });
    const data = await res.json();
    if (data.ok) {
      alertBox.innerHTML = `<div class="alert alert-success">${data.message || 'Password updated. You can sign in now.'}</div>`;
      setTimeout(() => window.location.href = 'login.html', 1500);
    } else {
      alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Failed to reset password.'}</div>`;
    }
  });
</script>
</body>
</html>
