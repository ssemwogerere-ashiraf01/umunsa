<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset Password - Nkobazambogo Students' Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="subtitle" id="subtitle">Answer your security question to reset your password right away.</p>
    <div id="alert-box"></div>

    <div id="security-reset">
      <p id="sec-instruction" style="color:var(--text-muted);">Enter your email and complete the security check to retrieve your security question.</p>
      <div class="form-group"><label for="sec-email">Email</label><input type="email" id="sec-email" placeholder="yourname@umu.ac.ug" /></div>
      <div id="captcha-container"></div>
      <button type="button" id="sec-load-btn" class="btn btn-outline-light btn-block" style="margin-bottom:0.75rem;">Continue</button>
      <div id="sec-question-row" style="display:none;">
        <p><strong id="sec-question"></strong></p>
        <div class="form-group"><label for="sec-answer">Answer</label><input type="text" id="sec-answer" autocomplete="off" /></div>
        <div class="form-group"><label for="sec-new-password">New password</label><input type="password" id="sec-new-password" minlength="8" /></div>
        <div class="form-group"><label for="sec-confirm-password">Confirm new password</label><input type="password" id="sec-confirm-password" minlength="8" /></div>
        <button id="sec-submit" class="btn btn-gold btn-block">Reset Password</button>
      </div>
    </div>

    <p class="form-footer"><a href="login.html">Back to Sign In</a><br /><a href="privacy">Privacy</a> &middot; <a href="terms">Terms</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import { FUNCTIONS_BASE } from './assets/js/auth.js';
  import { mountCaptcha } from './assets/js/captcha.js';
  import { SUPABASE_PUBLISHABLE_KEY } from './assets/js/supabase-client.js';
  mountNav();
  mountFooter();

  const fnHeaders = {
    'Content-Type': 'application/json',
    apikey: SUPABASE_PUBLISHABLE_KEY,
    Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
  };

  let captcha;
  let lastCaptchaPayload = null;

  (async () => {
    captcha = await mountCaptcha(document.getElementById('captcha-container'), { label: 'Security check' });
  })();

  async function loadSecurityQuestion() {
    const email = (document.getElementById('sec-email').value || '').trim().toLowerCase();
    const alertBox = document.getElementById('alert-box');
    const questionRow = document.getElementById('sec-question-row');
    if (!email || !email.includes('@')) {
      questionRow.style.display = 'none';
      alertBox.innerHTML = '<div class="alert alert-error">Enter a valid email address.</div>';
      return;
    }

    const captchaPayload = captcha ? captcha.getPayload() : null;
    if (!captchaPayload) {
      alertBox.innerHTML = '<div class="alert alert-error">Please complete the CAPTCHA.</div>';
      return;
    }

    alertBox.innerHTML = '<div class="alert alert-success">Looking up security question...</div>';
    questionRow.style.display = 'none';

    try {
      const res = await fetch(FUNCTIONS_BASE + '/functions/v1/password-reset', {
        method: 'POST',
        headers: fnHeaders,
        body: JSON.stringify({ action: 'get_question', email, ...captchaPayload })
      });
      const data = await res.json();

      if (data && data.ok && data.question) {
        document.getElementById('sec-question').textContent = data.question;
        questionRow.style.display = 'block';
        alertBox.innerHTML = '';
        lastCaptchaPayload = captchaPayload; // reuse same solved captcha for confirm step
        document.getElementById('sec-answer').focus();
      } else {
        questionRow.style.display = 'none';
        lastCaptchaPayload = null;
        alertBox.innerHTML = '<div class="alert alert-error">' + (data.error || 'No security question is set for this account. You cannot reset your password this way. Sign in and set one under Profile, or contact an administrator.') + '</div>';
        if (captcha) captcha.refresh();
      }
    } catch (err) {
      questionRow.style.display = 'none';
      lastCaptchaPayload = null;
      alertBox.innerHTML = '<div class="alert alert-error">Could not reach the server. Try again.</div>';
      if (captcha) captcha.refresh();
    }
  }

  document.getElementById('sec-load-btn').addEventListener('click', (e) => {
    e.preventDefault();
    loadSecurityQuestion();
  });
  document.getElementById('sec-email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      loadSecurityQuestion();
    }
  });

  document.getElementById('sec-submit').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('sec-email').value.trim().toLowerCase();
    const answer = document.getElementById('sec-answer').value || '';
    const pw = document.getElementById('sec-new-password').value || '';
    const confirm = document.getElementById('sec-confirm-password').value || '';
    const alertBox = document.getElementById('alert-box');
    if (!email || !answer || pw.length < 8 || pw !== confirm) {
      alertBox.innerHTML = '<div class="alert alert-error">Provide a valid email, answer, and matching passwords (min 8 chars).</div>';
      return;
    }

    // Prefer freshly solved captcha; fall back to the one used to load the question
    let captchaPayload = captcha ? captcha.getPayload() : null;
    if (!captchaPayload) captchaPayload = lastCaptchaPayload;
    if (!captchaPayload) {
      alertBox.innerHTML = '<div class="alert alert-error">Please complete the CAPTCHA again.</div>';
      if (captcha) captcha.refresh();
      return;
    }

    const btn = document.getElementById('sec-submit');
    btn.disabled = true;
    btn.textContent = 'Resetting...';
    try {
      const res = await fetch(FUNCTIONS_BASE + '/functions/v1/password-reset', {
        method: 'POST',
        headers: fnHeaders,
        body: JSON.stringify({
          action: 'confirm_question',
          email,
          answer,
          password: pw,
          ...captchaPayload,
        })
      });
      const data = await res.json();
      if (data.ok) {
        alertBox.innerHTML = '<div class="alert alert-success">' + (data.message || 'Password updated. You can sign in now.') + '</div>';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } else {
        alertBox.innerHTML = '<div class="alert alert-error">' + (data.error || 'Failed to reset password.') + '</div>';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
        lastCaptchaPayload = null;
        if (captcha) captcha.refresh();
      }
    } catch (err) {
      alertBox.innerHTML = '<div class="alert alert-error">Could not reach the server. Try again.</div>';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      if (captcha) captcha.refresh();
    }
  });
</script>
</body>
</html>
