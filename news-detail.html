<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News: Nkobazambogo Students' Association</title>
<meta name="description" content="News from Nkobazambogo Students' Association" />
<meta property="og:site_name" content="Nkobazambogo Students' Association" />
<meta property="og:type" content="article" />
<meta property="og:title" content="News: Nkobazambogo Students' Association" id="og-title" />
<meta property="og:description" content="" id="og-desc" />
<meta property="og:url" content="https://umunsa.vercel.app/news.html" id="og-url" />
<meta property="og:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" id="og-image" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="News" id="tw-title" />
<meta name="twitter:description" content="" id="tw-desc" />
<meta name="twitter:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" id="tw-image" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .detail-wrap { max-width: 720px; margin: 1.5rem auto 3rem; padding: 0 1rem; }
  .detail-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .detail-media img { width: 100%; max-height: 360px; object-fit: cover; display: block; }
  .detail-body { padding: 1.35rem 1.4rem 1.6rem; }
  .detail-body h1 { margin: 0 0 0.4rem; font-size: 1.55rem; color: var(--ink-navy); line-height: 1.25; }
  .detail-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
  .detail-content { white-space: pre-wrap; line-height: 1.6; margin: 0; }
  .share-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .share-row a, .share-row button {
    border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 0.45rem 0.75rem;
    font-size: 0.85rem; cursor: pointer; text-decoration: none; color: var(--text); font-family: inherit;
  }
  .back-link { display: inline-block; margin-bottom: 0.75rem; font-size: 0.9rem; }
  .doc-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1rem; }
</style>
</head>
<body>
<div id="app-nav"></div>
<div class="detail-wrap">
  <a class="back-link" href="news.html">← All news</a>
  <div id="detail" class="detail-card"><div class="detail-body"><p style="color:var(--text-muted);">Loading...</p></div></div>
</div>
<div id="app-footer"></div>
<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav('news');
  mountFooter();

  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('detail');
  function escapeHtml(str) {
    const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
  }
  function setMeta(title, desc, url, image) {
    document.title = title + ' · NSA';
    const pairs = [
      ['og-title', title], ['tw-title', title],
      ['og-desc', desc], ['tw-desc', desc],
      ['og-url', url],
      ['og-image', image], ['tw-image', image],
    ];
    for (const [eid, val] of pairs) {
      const el = document.getElementById(eid);
      if (el) el.setAttribute('content', val);
    }
  }
  function shareButtons(url, title) {
    const enc = encodeURIComponent;
    return `<div class="share-row">
      <button type="button" id="copy-link">Copy link</button>
      <a target="_blank" rel="noopener" href="https://wa.me/?text=${enc(title + ' ' + url)}">WhatsApp</a>
      <a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${enc(title)}&url=${enc(url)}">X</a>
      <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}">Facebook</a>
      <a target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}">LinkedIn</a>
    </div>`;
  }

  if (!id) {
    root.innerHTML = `<div class="detail-body"><p>News item not found. <a href="news.html">Back to news</a></p></div>`;
  } else {
    const { data: n, error } = await supabase.from('news').select('*').eq('id', id).maybeSingle();
    if (error || !n) {
      root.innerHTML = `<div class="detail-body"><p>${escapeHtml(error?.message || 'Not found.')} <a href="news.html">Back</a></p></div>`;
    } else {
      const pageUrl = `${location.origin}/news-detail.html?id=${encodeURIComponent(n.id)}`;
      const url = `${location.origin}/api/share?type=news&id=${encodeURIComponent(n.id)}`;
      const desc = (n.content || '').slice(0, 160);
      const image = n.image_url || 'https://umunsa.vercel.app/assets/img/og-default.jpg';
      setMeta(n.title, desc, url, image);
      const media = n.image_url ? `<div class="detail-media"><img src="${escapeHtml(n.image_url)}" alt="" /></div>` : '';
      const doc = n.document_url ? `<p class="doc-link"><a href="${escapeHtml(n.document_url)}" target="_blank" rel="noopener">📄 Open attachment</a></p>` : '';
      root.innerHTML = `${media}<div class="detail-body">
        <h1>${escapeHtml(n.title)}</h1>
        <div class="detail-meta">${new Date(n.published_at).toLocaleString()}</div>
        <p class="detail-content">${escapeHtml(n.content)}</p>
        ${doc}
        ${shareButtons(url, n.title)}
      </div>`;
      document.getElementById('copy-link')?.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(url); alert('Link copied'); }
        catch { prompt('Copy this link:', url); }
      });
    }
  }
</script>
</body>
</html>
