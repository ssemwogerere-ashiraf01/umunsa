<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project: Nkobazambogo Students' Association</title>
<meta property="og:type" content="article" />
<meta property="og:title" content="Project" id="og-title" />
<meta property="og:description" content="" id="og-desc" />
<meta property="og:url" content="" id="og-url" />
<meta property="og:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" id="og-image" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Project" id="tw-title" />
<meta name="twitter:description" content="" id="tw-desc" />
<meta name="twitter:image" content="https://umunsa.vercel.app/assets/img/og-default.jpg" id="tw-image" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .detail-wrap { max-width: 720px; margin: 1.5rem auto 3rem; padding: 0 1rem; }
  .detail-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .detail-media img { width: 100%; max-height: 360px; object-fit: cover; display: block; }
  .detail-body { padding: 1.35rem 1.4rem 1.6rem; }
  .detail-body h1 { margin: 0 0 0.4rem; font-size: 1.55rem; color: var(--ink-navy); }
  .detail-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
  .detail-content { white-space: pre-wrap; line-height: 1.6; }
  .share-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .share-row a, .share-row button {
    border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 0.45rem 0.75rem;
    font-size: 0.85rem; cursor: pointer; text-decoration: none; color: var(--text); font-family: inherit;
  }
  .back-link { display: inline-block; margin-bottom: 0.75rem; font-size: 0.9rem; }
</style>
</head>
<body>
<div id="app-nav"></div>
<div class="detail-wrap">
  <a class="back-link" href="projects.html">← All projects</a>
  <div id="detail" class="detail-card"><div class="detail-body"><p style="color:var(--text-muted);">Loading...</p></div></div>
</div>
<div id="app-footer"></div>
<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav('projects');
  mountFooter();
  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('detail');
  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
  if (!id) {
    root.innerHTML = `<div class="detail-body"><p>Not found. <a href="projects.html">Back</a></p></div>`;
  } else {
    const { data: p, error } = await supabase.from('projects').select('*').eq('id', id).maybeSingle();
    if (error || !p) {
      root.innerHTML = `<div class="detail-body"><p>${escapeHtml(error?.message || 'Not found')}</p></div>`;
    } else {
      const pageUrl = `${location.origin}/project-detail.html?id=${encodeURIComponent(p.id)}`;
      const url = `${location.origin}/s/project/${encodeURIComponent(p.id)}`;
      const desc = (p.description || '').slice(0, 160);
      const image = p.image_url || 'https://umunsa.vercel.app/assets/img/og-default.jpg';
      document.title = p.title + ' · NSA';
      ['og-title','tw-title'].forEach(i => document.getElementById(i)?.setAttribute('content', p.title));
      ['og-desc','tw-desc'].forEach(i => document.getElementById(i)?.setAttribute('content', desc));
      document.getElementById('og-url')?.setAttribute('content', url);
      ['og-image','tw-image'].forEach(i => document.getElementById(i)?.setAttribute('content', image));
      const media = p.image_url ? `<div class="detail-media"><img src="${escapeHtml(p.image_url)}" alt="" /></div>` : '';
      const doc = p.document_url ? `<p><a href="${escapeHtml(p.document_url)}" target="_blank" rel="noopener">📄 Open attachment</a></p>` : '';
      const enc = encodeURIComponent;
      root.innerHTML = `${media}<div class="detail-body">
        <h1>${escapeHtml(p.title)}</h1>
        <div class="detail-meta">${escapeHtml(p.status || '')}${p.start_date ? ' · ' + escapeHtml(p.start_date) : ''}</div>
        <div class="detail-content">${escapeHtml(p.description || '')}</div>
        ${doc}
        <div class="share-row">
          <button type="button" id="copy-link">Copy link</button>
          <a target="_blank" rel="noopener" href="https://wa.me/?text=${enc(p.title + ' ' + url)}">WhatsApp</a>
          <a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${enc(p.title)}&url=${enc(url)}">X</a>
          <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}">Facebook</a>
        </div>
      </div>`;
      document.getElementById('copy-link')?.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(url); alert('Link copied'); } catch { prompt('Copy:', url); }
      });
    }
  }
</script>
</body>
</html>
